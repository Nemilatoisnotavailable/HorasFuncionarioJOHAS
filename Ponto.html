<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Banco de Horas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {

    width:100%;
    height:100%;

    overflow:hidden;

    font-family: Arial, sans-serif;
}

body {

    display:flex;

    justify-content:center;
    align-items:center;

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    color:white;

    text-shadow:
        2px 2px 8px rgba(0,0,0,0.9);

    padding:20px;

    transition:
        background-image 0.5s ease;
}

.container {

    width:min(90vw, 500px);

    background: rgba(1,182,249,0.15);

    backdrop-filter: blur(6px);

    border-radius:24px;

    padding:clamp(20px, 4vw, 40px);

    text-align:center;
    
    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);
    
}

.nome {

    font-size:
        clamp(2rem, 6vw, 4rem);

    font-weight:bold;

    word-break:break-word;
}

.label-horas {

    margin-top:20px;

    font-size:
        clamp(1rem, 3vw, 1.5rem);

    opacity:0.9;
}

.horas {

    margin-top:10px;

    font-size:
        clamp(2.5rem, 8vw, 5rem);

    font-weight:bold;
}

.atualizacao {

    margin-top:25px;

    font-size:
        clamp(0.8rem, 2vw, 1rem);

    opacity:0.9;
}

.erro {

    color:#ff8080;
}

</style>

</head>

<body>

<div class="container">

    <div
    class="nome"
    id="nome">

        Carregando...

    </div>

    <div class="label-horas">

        Quantidade de horas:

    </div>

    <div
    class="horas"
    id="horas">

        ...

    </div>

    <div
    class="atualizacao"
    id="atualizacao">

    </div>

</div>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const id =
    params.get("id");

const body =
    document.body;

const vertical =
    window.innerHeight >
    window.innerWidth;

const fundoPersonalizado =
    vertical
    ? `fundos/${id}-mobile.webp`
    : `fundos/${id}-pc.webp`;

const fundoPadrao =
    vertical
    ? "fundo-mobile.webp"
    : "fundo-pc.webp";

const img = new Image();

img.onload = function () {

    body.style.backgroundImage =
        `url('${fundoPersonalizado}')`;
};

img.onerror = function () {

    body.style.backgroundImage =
        `url('${fundoPadrao}')`;
};

img.src = fundoPersonalizado;

fetch(
"https://script.google.com/macros/s/AKfycbzEvM5jtDQaQkdqlcz6GzdS0TG_TgWW5wHxyi84aindkghYke4rGExZIpJnMd38Wcm77g/exec?id="
+ id
)

.then(response => response.text())

.then(text => {

    const data =
        JSON.parse(text);

    if (data.erro) {

        document
        .getElementById("nome")
        .innerText =
            "Acesso inválido";

        document
        .getElementById("nome")
        .classList
        .add("erro");

        document
        .getElementById("horas")
        .innerText = "";

        return;
    }

    document
    .getElementById("nome")
    .innerText =
        data.nome;

    document
    .getElementById("horas")
    .innerText =
        data.horas;

    document
    .getElementById("atualizacao")
    .innerText =
        "Atualizado em: "
        + data.atualizado;

})

.catch(error => {

    console.error(error);

    document
    .getElementById("nome")
    .innerText =
        "Erro de conexão";

});

</script>

</body>

</html>
